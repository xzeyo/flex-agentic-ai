[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "four-agent-team"
version = "0.1.0"
description = "A bounded CrewAI engineering workflow with disposable Docker checks"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "docker>=7.1,<8", "crewai[litellm]>=1.15,<2",
  "litellm>=1.105.3,<1.106",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-docker>=7,<8"]

[project.scripts]
four-agent = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["docker: requires the local runner image and Docker daemon", "live: requires explicit paid model opt-in"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["crewai", "crewai.*"]
follow_imports = "skip"
