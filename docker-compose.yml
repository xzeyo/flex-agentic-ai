services:
  api:
    build: ./backend
    env_file: .env
    environment:
      TEAM_DATA_DIR: /data
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - run-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${TEAM_API_PORT:-8000}:8000"
    init: true
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${TEAM_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  run-data:
